name: Angular CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  repository_dispatch:
    types: [build-and-push]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            API_URL=http://35.181.137.137/api
          tags: |
            joseph0070/freelancescope:angular-latest
            joseph0070/freelancescope:angular-${{ github.sha }}
