<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <a routerLink="/projects" class="text-gray-500 hover:text-gray-700">&larr; Retour</a>
    <h1 class="text-2xl font-bold text-gray-900">{{ isEdit ? 'Modifier' : 'Nouveau' }} projet</h1>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    @if (error()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Client *</label>
        <select formControlName="client_id" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
          <option [value]="0">Sélectionnez un client</option>
          @for (client of clients(); track client.id) {
            <option [value]="client.id">{{ client.company_name }}</option>
          }
        </select>
        @if (form.controls.client_id.touched && form.controls.client_id.invalid) {
          <p class="text-red-500 text-xs mt-1">Requis</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nom du projet *</label>
        <input type="text" formControlName="name" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" />
        @if (form.controls.name.touched && form.controls.name.invalid) {
          <p class="text-red-500 text-xs mt-1">Requis</p>
        }
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
        <textarea formControlName="description" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
      </div>
      @if (isEdit) {
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Statut</label>
          <select formControlName="status" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
            <option value="draft">Brouillon</option>
            <option value="in_progress">En cours</option>
            <option value="completed">Terminé</option>
          </select>
        </div>
      }
      <button type="submit" [disabled]="form.invalid" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors">
        {{ isEdit ? 'Enregistrer' : 'Créer' }}
      </button>
    </form>
  </div>
</div>
