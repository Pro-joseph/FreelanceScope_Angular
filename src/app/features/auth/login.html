<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-2xl font-bold text-gray-900 text-center mb-8">Connexion</h1>

      @if (error) {
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
          {{ error }}
        </div>
      }

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
            placeholder="vous@exemple.com"
          />
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <p class="text-red-500 text-xs mt-1">Email valide requis</p>
          }
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
          <input
            id="password"
            type="password"
            formControlName="password"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-colors"
            placeholder="••••••••"
          />
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <p class="text-red-500 text-xs mt-1">Mot de passe requis</p>
          }
        </div>

        <button
          type="submit"
          [disabled]="form.invalid"
          class="w-full py-2 px-4 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
        >
          Se connecter
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-500 space-y-2">
        <p><a routerLink="/register" class="text-indigo-600 hover:text-indigo-800">Créer un compte</a></p>
        <p><a routerLink="/forgot-password" class="text-indigo-600 hover:text-indigo-800">Mot de passe oublié ?</a></p>
      </div>
    </div>
  </div>
</div>
