<div class="min-h-screen flex items-center justify-center bg-gray-50">
  <div class="w-full max-w-md">
    <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
      <h1 class="text-2xl font-bold text-gray-900 text-center mb-2">Mot de passe oublié</h1>
      <p class="text-gray-500 text-center text-sm mb-8">Recevez un lien de réinitialisation par email</p>

      @if (sent) {
        <div class="p-4 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm text-center">
          Email envoyé ! Vérifiez votre boîte de réception.
        </div>
      } @else {
        @if (error) {
          <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
            {{ error }}
          </div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="email" type="email" formControlName="email" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition-colors" />
            @if (form.controls.email.touched && form.controls.email.invalid) {
              <p class="text-red-500 text-xs mt-1">Email valide requis</p>
            }
          </div>

          <button type="submit" [disabled]="form.invalid" class="w-full py-2 px-4 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            Envoyer
          </button>
        </form>
      }

      <p class="mt-6 text-center text-sm text-gray-500">
        <a routerLink="/login" class="text-indigo-600 hover:text-indigo-800">Retour à la connexion</a>
      </p>
    </div>
  </div>
</div>
