<div class="max-w-3xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <a routerLink="/clients" class="text-gray-500 hover:text-gray-700">&larr; Retour</a>
    <h1 class="text-2xl font-bold text-gray-900">{{ client()?.company_name }}</h1>
    <a [routerLink]="['/clients', client()?.id, 'edit']" class="ml-auto text-sm text-indigo-600 hover:text-indigo-800">Modifier</a>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4">
    <div class="grid grid-cols-2 gap-4">
      <div>
        <p class="text-sm text-gray-500">Email</p>
        <p class="text-gray-900">{{ client()?.email || '—' }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-500">Téléphone</p>
        <p class="text-gray-900">{{ client()?.phone || '—' }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-500">Projets</p>
        <p class="text-gray-900">{{ client()?.projects_count ?? '—' }}</p>
      </div>
      <div>
        <p class="text-sm text-gray-500">Créé le</p>
        <p class="text-gray-900">{{ client()?.created_at ? (client()!.created_at | date) : '—' }}</p>
      </div>
    </div>
  </div>

  <div class="mt-8">
    <h2 class="text-lg font-semibold text-gray-900 mb-4">Projets</h2>
      <a [routerLink]="['/projects/new']" [queryParams]="{client_id: client()?.id}" class="text-indigo-600 hover:text-indigo-800 text-sm">
      + Créer un projet pour ce client
    </a>
  </div>
</div>
