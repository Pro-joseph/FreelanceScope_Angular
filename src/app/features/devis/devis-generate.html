<div class="max-w-2xl mx-auto">
  <div class="flex items-center gap-4 mb-6">
    <a [routerLink]="['/projects', projectId]" class="text-gray-500 hover:text-gray-700">&larr; Retour</a>
    <h1 class="text-2xl font-bold text-gray-900">Générer un devis</h1>
  </div>

  <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
    @if (error()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Conditions particulières</label>
        <textarea formControlName="conditions" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Délais, garanties, modalités de paiement..."></textarea>
      </div>
      <button type="submit" [disabled]="loading()" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors">
        @if (loading()) {
          Génération en cours...
        } @else {
          Générer le devis
        }
      </button>
    </form>
  </div>
</div>
